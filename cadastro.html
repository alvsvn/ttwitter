<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastre-se na TTwitter, a rede social para compartilhar o que você pensa.">
  <title>TTwitter | Cadastro</title>
  <link rel="stylesheet" href="style/cadastro.css">
</head>
<body>

  <main class="cadastro-container">

    <section class="cadastro-card">
      <form class="cadastro-form">

        <h1>Cadastro</h1>

        <div class="input-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="nome de usuário" tabindex="-1" required>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" tabindex="-1" required>
        </div>

        <div class="input-group">
          <label for="nascimento">Data de nascimento</label>
          <input type="text" id="nascimento" name="nascimento" placeholder="xx/xx/xxxx" tabindex="-1" required>
        </div>

        <div class="input-group senha-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="••••••••••" tabindex="-1" required>
          <button type="button" class="toggle-senha" aria-label="Mostrar senha" tabindex="-1">
            <img src="img/icon/olho.svg" alt="">
          </button>
        </div>

        <div class="input-group senha-group">
          <label for="confirmar-senha">Confirmar senha</label>
          <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="••••••••••" tabindex="-1" required>
          <button type="button" class="toggle-senha" aria-label="Mostrar senha" tabindex="-1">
            <img src="img/icon/olho.svg" alt="">
          </button>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="termos" name="termos" tabindex="-1" required>
          <label for="termos">
            Li e estou de acordo com os
            <span class="termos-link">Termos</span> e
            <span class="termos-link">Condições de uso</span>.
          </label>
        </div>

        <button type="button" class="btn-cadastrar" tabindex="-1">Cadastrar</button>

        <a href="login.html" class="link-login">Fazer Login</a>

      </form>
    </section>

    <section class="cadastro-brand" aria-hidden="true">
      <img src="img/icon/LogoTT.svg" alt="" class="cadastro-logo">
    </section>

  </main>

</body>
</html>
