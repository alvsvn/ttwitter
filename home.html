<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página inicial da TTwitter: veja publicações, interaja e conecte-se com pessoas.">
  <title>TTwitter | Home</title>
  <link rel="stylesheet" href="style/home.css">
</head>
<body>

  <header class="home-header">
    <img src="img/icon/LogoTT.svg" alt="TTwitter" class="home-logo">
    <div class="search-bar">
      <input type="text" placeholder="Buscar" class="search-input">
      <img src="img/icon/buscar.svg" alt="" class="search-icon">
    </div>
  </header>

  <div class="home-body">

    <nav class="sidebar" aria-label="Navegação principal">
      <a href="#" class="sidebar-icon">
        <img src="img/icon/HomeOutlined.svg" alt="Home">
      </a>
      <a href="#" class="sidebar-icon">
        <img src="img/icon/BellOutlined.svg" alt="Notificações">
      </a>
      <a href="#" class="sidebar-icon">
        <img src="img/icon/CommentOutlined.svg" alt="Mensagens">
      </a>
      <a href="#" class="sidebar-icon">
        <img src="img/icon/SettingOutlined.svg" alt="Configurações">
      </a>
    </nav>

    <main class="feed">

      <section class="create-post">
        <textarea placeholder="No que está pensando...?" class="post-input"></textarea>
        <div class="create-post-actions">
          <div class="post-icons">
            <button type="button" class="icon-btn" aria-label="Adicionar imagem">
              <img src="img/icon/imagepost.svg" alt="">
            </button>
            <button type="button" class="icon-btn" aria-label="Adicionar emoji">
              <img src="img/icon/emojipost.svg" alt="">
            </button>
            <button type="button" class="icon-btn" aria-label="Adicionar link">
              <img src="img/icon/linkpost.svg" alt="">
            </button>
          </div>
          <button type="button" class="btn-postar">Postar</button>
        </div>
      </section>

      <article class="post-card">
        <img src="img/image 16.png" alt="Publicação de @usuario" class="post-image">
        <div class="post-footer">
          <div class="post-user">
            <span class="avatar"></span>
            <span class="username">@usuario</span>
          </div>
          <div class="post-reactions">
            <button type="button" class="icon-btn" aria-label="Comentar">
              <img src="img/icon/comentarfoto.svg" alt="" class="icon-comentar">
            </button>
            <button type="button" class="icon-btn" aria-label="Curtir">
              <img src="img/icon/joinha.svg" alt="" class="icon-joinha">
            </button>
            <button type="button" class="icon-btn" aria-label="Favoritar">
              <img src="img/icon/coracao.svg" alt="" class="icon-coracao">
            </button>
          </div>
        </div>
        <p class="post-text">
          Lorem ipsum Lorem ipsum Lorem ipsum Lorem ipsum Lorem ipsum.
        </p>
      </article>

    </main>

    <aside class="suggestions" aria-label="Sugestões de pessoas">
      <h2 class="suggestions-title-desktop">Pessoas que você talvez conheça</h2>
      <h2 class="suggestions-title-mobile">Talvez você conheça</h2>
      <ul class="suggestion-list">
        <li class="suggestion-item">
          <span class="avatar"></span>
          <span class="username">@usuario</span>
          <button type="button" class="btn-adicionar">Adicionar</button>
        </li>
        <li class="suggestion-item">
          <span class="avatar"></span>
          <span class="username">@usuario</span>
          <button type="button" class="btn-adicionar">Adicionar</button>
        </li>
        <li class="suggestion-item">
          <span class="avatar"></span>
          <span class="username">@usuario</span>
          <button type="button" class="btn-adicionar">Adicionar</button>
        </li>
        <li class="suggestion-item">
          <span class="avatar"></span>
          <span class="username">@usuario</span>
          <button type="button" class="btn-adicionar">Adicionar</button>
        </li>
      </ul>
    </aside>

  </div>

</body>
</html>
